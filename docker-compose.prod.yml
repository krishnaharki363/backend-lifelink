# ════════════════════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production Environment
# ════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   npm run docker:prod        → Build production image and start
#   npm run docker:prod:detach → Start in background (daemon mode)
#   npm run docker:down:prod   → Stop and remove containers
#
# ENVIRONMENT VARIABLES:
#   Create a .env.production file (NEVER commit it) with real production values.
#   See .env.example for the full list of required variables.
#
#   Alternatively, on hosting platforms (Render, Railway, Fly.io), set env vars
#   directly in the platform dashboard — they are injected at runtime.
#
# MIGRATIONS:
#   The docker-entrypoint.sh runs `prisma migrate deploy` before the server
#   starts. This is idempotent and safe for repeated deploys.
# ════════════════════════════════════════════════════════════════════════════

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Build only the production stage of the multi-stage Dockerfile
      target: production
    container_name: lifelink-api-prod
    ports:
      - "5000:5000"
    env_file:
      # Copy .env to .env.production and fill in real production values.
      # This file must exist before running docker compose -f docker-compose.prod.yml up
      - .env.production
    environment:
      NODE_ENV: production
    # Always restart unless explicitly stopped (docker stop / docker compose down)
    restart: unless-stopped
    # Health check — Docker marks the container unhealthy if /health fails,
    # and orchestrators (Docker Swarm, ECS) use this to restart unhealthy replicas.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
